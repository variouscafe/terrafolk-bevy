<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
        <title>Terrafolk — A Living World of AI Villagers</title>
        <link data-trunk rel="copy-dir" href="assets"/>
        <link data-trunk rel="copy-dir" href="credits"/>
        <link data-trunk rel="copy-file" href="build/windows/icon.ico"/>
        <link rel="icon" href="icon.ico">
        <link data-trunk rel="inline" href="build/web/styles.css"/>
        <link data-trunk rel="inline" href="assets/web/tf-ui.css"/>
    </head>
    <body class="tf-loading">
        <link data-trunk rel="inline" href="build/web/sound.js"/>
        <script src="assets/web/colyseus.js"></script>
        <script src="assets/web/worldsim.js"></script>
        <script src="assets/web/ui.js"></script>
        <!-- ☰ 메뉴·중앙 팝업 DOM UI — 사전·어휘(tf-data) → i18n(tf-i18n) →
             LPC 외형·아이콘 합성(tf-look) → UI 본체(tf-ui). worldsim이 DOMContentLoaded
             에 접속·백로그 시딩을 시작하므로 head 로드로 충분하다. -->
        <script src="assets/web/tf-data.js"></script>
        <script src="assets/web/tf-i18n.js"></script>
        <script src="assets/web/tf-look.js"></script>
        <script src="assets/web/tf-ui.js"></script>
        <!-- 월드 앵커 오버레이 — 말풍선·이름 라벨·활동 배지·토스트·미니맵.
             Rust(overlay.rs)의 tf.onOverlay 투영을 소비, TF_UI.feed를 wrap. -->
        <script src="assets/web/tf-world-ui.js"></script>
        <div class="game-container">
            <div class="lds-dual-ring"></div>
            <!-- 폴백 텍스트 — tf-ui.js가 DOMContentLoaded에 tOr('boot.loading')로 교체 -->
            <div class="tf-boot-caption">세계에 접속하는 중…</div>
            <div class="tf-precip" aria-hidden="true"></div>
            <canvas id="bevy">
                Javascript and support for canvas is required
            </canvas>
        </div>
        <script>
            // 모바일 브라우저 제스처 방어 — winit가 처리하기 전에라도 브라우저 기본
            // 동작(풀투리프레시·루브밴딩·더블탭 줌)을 확실히 잠근다.
            // passive:false 필수 — 아니면 preventDefault가 무시된다.
            // (메인.rs의 prevent_default_event_handling:false는 유지 — true면 F5·Cmd+R 사망)
            (function () {
                var c = document.getElementById("bevy");
                if (!c) return;
                var block = function (e) { e.preventDefault(); };
                c.addEventListener("touchstart", block, { passive: false });
                c.addEventListener("touchmove", block, { passive: false });
            })();
            // 라이브 프라임 로딩 해제 — Rust(apply.rs prime_live_world)가 tf.uiPrime()
            // 를 호출하면 오버레이를 내린다(데모 월드는 wasm에서 스폰하지 않는다).
            // 백엔드 불통 시 스피너 유지 — worldsim이 계속 재시도하다 살아나면 프라임.
            (function () {
                var tf = window.terrafolk || (window.terrafolk = {});
                tf.uiPrime = function () {
                    document.body.classList.remove("tf-loading");
                };
            })();
        </script>
    </body>
</html>
